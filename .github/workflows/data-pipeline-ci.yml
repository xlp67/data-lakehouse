name: CI/CD do Pipeline de Dados

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'contracts/**'
      - 'dbt_project/**'
      - 'scripts/**'
      - 'terraform/**'

jobs:
  # ===============================================================
  # Job de CI: Valida, Testa e Planeja
  # ===============================================================
  ci:
    name: Integração Contínua (CI)
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Verificação de Formato do Terraform
        run: terraform fmt -check -recursive
        working-directory: ./terraform

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Linting de Python (Ruff)
        run: .venv/bin/ruff check .

      - name: Formatação de Python (Black)
        run: .venv/bin/black --check .
      
      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan
        working-directory: ./terraform

      - name: Gatekeeper de Qualidade de Dados
        run: |
          .venv/bin/python scripts/generate_mock_data.py --output-file mock_transactions.json
          .venv/bin/python scripts/validate_contract.py --data-file mock_transactions.json --contract ./contracts/transactions_v1.yaml

      - name: Executar modelos dbt
        env:
          DBT_PII_SALT_SECRET: ${{ secrets.PII_SALT_SECRET }}
        run: |
          .venv/bin/dbt build --project-dir ./dbt_project

  # ===============================================================
  # Job de CD: Implanta a infraestrutura após aprovação
  # ===============================================================
  deploy:
    name: Implantação Contínua (CD)
    needs: ci # Este job só executa se o 'ci' for bem-sucedido
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Apenas na branch 'main'

    runs-on: ubuntu-latest
    
    environment:
      name: production
      url: 'https://console.cloud.google.com' # URL para o ambiente

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'
          
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"
        working-directory: ./terraform
