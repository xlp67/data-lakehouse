name: Data Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'contracts/**'
      - 'dbt_project/**'
      - 'scripts/**'
      - 'terraform/**'

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------- 
      # 1. GCP Authentication
      # ------------------------------------------- 
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      # ------------------------------------------- 
      # 2. Linting & Formatting
      # ------------------------------------------- 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Python Linting (Ruff)
        run: .venv/bin/ruff check .

      - name: Python Formatting (Black)
        run: .venv/bin/black --check .
      
      # ------------------------------------------- 
      # 3. Infrastructure Plan (Terraform)
      # ------------------------------------------- 
      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan
        working-directory: ./terraform

      # ------------------------------------------- 
      # 4. Data Validation & Transformation (Python & dbt)
      # ------------------------------------------- 
      - name: Data Quality Gatekeeper
        run: |
          .venv/bin/python scripts/generate_mock_data.py --output-file mock_transactions.json
          .venv/bin/python scripts/validate_contract.py --data-file mock_transactions.json --contract ./contracts/transactions_v1.yaml

      - name: Run dbt models
        env:
          DBT_PII_SALT_SECRET: ${{ secrets.PII_SALT_SECRET }}
        run: |
          # This step requires dbt to be configured with credentials to access BigQuery.
          # For a CI environment, this is typically done via a profiles.yml file
          # that uses the application default credentials from the 'auth' step.
          .venv/bin/dbt build --project-dir ./dbt_project

      # ------------------------------------------- 
      # 5. Security Scan (Placeholder)
      # ------------------------------------------- 
      - name: Security Scan
        run: |
          echo "Scanning for hardcoded secrets and exposed PII..."
          # Example: gitleaks detect --source . --verbose
          echo "Security scan placeholder complete."