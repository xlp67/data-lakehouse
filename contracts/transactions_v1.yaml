# Contrato de Dados para o SecureGuard Lakehouse
# Versão: 1.0
# Descrição: Define o esquema para transações financeiras.
schema:
  transaction_id:
    type: string
    required: true
    description: "Identificador único para a transação (UUID)."
  user_id:
    type: string
    required: true
    description: "Identificador do usuário associado à transação."
  user_email:
    type: string
    required: true
    format: email
    pii: true
    description: "Endereço de e-mail do usuário."
  user_cpf:
    type: string
    required: true
    pattern: "^[0-9]{11}$"
    pii: true
    description: "Número do CPF do usuário (Cadastro de Pessoas Físicas)."
  transaction_amount:
    type: number
    required: true
    description: "O valor da transação."
  transaction_timestamp:
    type: string
    format: "date-time"
    required: true
    description: "Timestamp de quando a transação ocorreu (ISO 8601)."
  payment_method:
    type: string
    required: true
    enum: ["credit_card", "debit_card", "pix", "boleto"]
    description: "Método de pagamento utilizado."
quality_checks:
  - type: "uniqueness"
    column: "transaction_id"
  - type: "not_null"
    columns: ["user_id", "transaction_timestamp", "transaction_amount"]
  - type: "range"
    column: "transaction_amount"
    min: 0.01
